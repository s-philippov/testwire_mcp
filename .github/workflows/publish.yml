name: Publish to pub.dev

on:
  push:
    tags:
      - "testwire*-v*" # Triggered by any melos version tag

# Requires OIDC token for pub.dev authentication.
# See: https://dart.dev/tools/pub/automated-publishing
permissions:
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # setup-dart configures OIDC token for pub.dev automated publishing.
      # flutter-action alone does not handle this.
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate melos
      - run: melos bootstrap

      # Publish in dependency order, skipping already-published versions.
      - name: Publish packages
        run: .github/scripts/publish.sh
